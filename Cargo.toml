[package]
name        = "tgexport"
description = "Telegram Desktop style data export (JSON + HTML) built on ferogram MTProto"
version     = "0.1.0"
edition     = "2024"
license     = "MIT OR Apache-2.0"
authors     = ["Ankit Chaubey <ankitchaubey.dev@gmail.com>"]
readme      = "README.md"
repository  = "https://github.com/ankit-chaubey/tgexport"
include     = ["src/**", "assets/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[[bin]]
name = "tgexport"
path = "src/main.rs"

[dependencies]
ferogram   = "0.6.7"
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "signal", "sync"] }
chrono     = { version = "0.4", features = ["clock"] }
clap       = { version = "4", features = ["derive", "env"] }
mime_guess = "2"
serde_json = "1"
sha2 = "0.11"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
unicode-general-category = "1"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 4
panic         = "abort"
strip         = true

# Smallest and fastest binary, for releases. Slow and memory hungry to build,
# so use it on a PC: cargo build --profile dist
[profile.dist]
inherits      = "release"
opt-level     = 3
lto           = "fat"
codegen-units = 1
